name: "UA-BLE Pairing"
slug: anduable_pair
version: "0.2.0"
description: "Pair UA-BLE via BlueZ/DBus on HAOS host"
arch:
  - aarch64
  - amd64
  - armv7
  - i386
startup: services
boot: manual
init: false

# ВАЖНО: доступ к хостовому DBus, где живёт BlueZ
host_dbus: true

# Для BLE часто требуется расширенный доступ (в т.ч. к сети raw)
privileged:
  - NET_ADMIN
  - NET_RAW

options:
  address: ""
  name_hint: "UA-BLE"
  adapter: "hci0"
  discover_seconds: 30
schema:
  address: str?
  name_hint: str?
  adapter: str
  discover_seconds: int
